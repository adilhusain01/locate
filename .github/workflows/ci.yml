name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build --sizes
        working-directory: contracts
      - name: Tests (unit, fuzz, integration, invariants)
        run: forge test -vv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci

  stylus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus
      - name: Unit tests
        run: cargo test
        working-directory: stylus
      - name: Wasm build
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: stylus

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts build for ABIs
        run: forge build
        working-directory: contracts
      - name: Regenerate ABIs and check they are committed
        run: pnpm wagmi generate && git diff --exit-code src/abis.ts
        working-directory: packages/sdk
      - name: Type checks
        run: |
          (cd packages/sdk && npx tsc -p .)
          (cd apps/keepers && npx tsc -p .)
          (cd apps/indexer && pnpm ponder codegen && npx tsc --noEmit)
          (cd apps/web && npx tsc --noEmit)
      - name: Web build
        run: pnpm build
        working-directory: apps/web
